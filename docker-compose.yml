services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-signal-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "trading"
      POSTGRES_PASSWORD: "trading123"
      POSTGRES_DB: "trading_signal"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_signal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
